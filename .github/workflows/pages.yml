name: pages
on:
  push:
    branches: [astro, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh the shared theme (sites track its main branch)
        run: npm install starlight-theme-luna@git+https://github.com/vdbxio/starlight-theme-luna.git --no-save
      - name: Build (preview URL until the custom domain is set)
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://vdbxio.github.io' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/wiki' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
